# Optional helpers for adding Power Up / Power Down events by hand from the dashboard.
# Enable packages in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
input_select:
  et_event_kind:
    name: Event type
    options: [power_down, power_up]
    initial: power_down
input_datetime:
  et_event_start:
    name: Event start
    has_date: true
    has_time: true
  et_event_end:
    name: Event end
    has_date: true
    has_time: true
input_number:
  et_event_rate_p:
    name: Event rate (p/kWh, 0 = use defaults)
    min: 0
    max: 500
    step: 0.5
    initial: 0
    unit_of_measurement: p/kWh
script:
  et_add_event:
    alias: Energy Twin - add event
    sequence:
      - action: energy_twin.add_event
        data:
          kind: "{{ states('input_select.et_event_kind') }}"
          start: "{{ states('input_datetime.et_event_start') }}"
          end: "{{ states('input_datetime.et_event_end') }}"
          import_rate_p: >-
            {{ states('input_number.et_event_rate_p') | float(0) if states('input_select.et_event_kind') == 'power_up' and states('input_number.et_event_rate_p') | float(0) > 0 else omit }}
          export_rate_p: >-
            {{ states('input_number.et_event_rate_p') | float(0) if states('input_select.et_event_kind') == 'power_down' and states('input_number.et_event_rate_p') | float(0) > 0 else omit }}
