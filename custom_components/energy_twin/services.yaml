add_event:
  fields:
    kind:
      required: true
      selector:
        select:
          options: [power_up, power_down]
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    import_rate_p:
      selector:
        number: {min: -50, max: 100, step: 0.01, unit_of_measurement: p/kWh}
    export_rate_p:
      selector:
        number: {min: 0, max: 500, step: 0.01, unit_of_measurement: p/kWh}
    bonus_p:
      selector:
        number: {min: 0, max: 500, step: 0.01, unit_of_measurement: p/kWh}
clear_events:
run_sweep:
  fields:
    battery_kwh:
      selector:
        object:
    pv_kwp:
      selector:
        object:
    inverter_kw:
      selector:
        object:
    strategy:
      selector:
        select:
          options: [rules, optimised]
recalculate:
reset_twin:
