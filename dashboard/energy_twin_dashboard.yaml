# Home Energy Twin dashboard.
# Paste into: Settings > Dashboards > (new dashboard) > Raw configuration editor.
# Per-scenario tabs show ONE scenario: run scripts/gen_dashboard.py <entity-prefix> to make one for another.
# Charts need "apexcharts-card" from HACS (Frontend). Everything else is core cards.
title: Energy Twin
views:
  # ───────────────────────────── COMPARE SETUPS ─────────────────────────────
  # Auto-discovers every Home Energy Twin scenario - nothing to edit when you add one.
  - title: Compare
    path: compare
    icon: mdi:scale-balance
    cards:
      - type: markdown
        title: At a glance
        content: |
          {%- macro bar(v, mx, n=16) -%}{{ '█' * ((v / mx * n) | round(0) | int) if mx > 0 and v > 0 else '' }}{%- endmacro -%}
          {%- macro gbp(v) -%}{{ '-' if v < 0 else '' }}£{{ '{:,.0f}'.format(v | abs) }}{%- endmacro -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for e in integration_entities('energy_twin') | select('match', 'sensor\\..*_annual_saving$') | list -%}
          {%- if states(e) not in ['unknown', 'unavailable'] -%}
          {%- set ns.rows = ns.rows + [dict(
            e=e, name=state_attr(e, 'scenario') or e, saving=states(e) | float(0),
            npv=state_attr(e, 'npv') | float(0), payback=state_attr(e, 'payback_years') | float(99),
            net=state_attr(e, 'monthly_net_cashflow') | float(0), capex=state_attr(e, 'capex') | float(0),
            n10=state_attr(e, 'net_10y') | float(0), cum=state_attr(e, 'cumulative_by_year') or [],
            monthly=state_attr(e, 'monthly') or [], kwh=state_attr(e, 'battery_kwh'), kwp=state_attr(e, 'pv_kwp'),
            pv=state_attr(e, 'pv_saving') | float(0), bat=state_attr(e, 'battery_saving') | float(0),
            hp=state_attr(e, 'hp_saving') | float(0), bill_today=state_attr(e, 'bill_today') | float(0),
            bill_with=state_attr(e, 'bill_with') | float(0), elec_with=state_attr(e, 'elec_with') | float(0),
            gas_with=state_attr(e, 'gas_with') | float(0), elec_today=state_attr(e, 'elec_today') | float(0),
            gas_today=state_attr(e, 'gas_today') | float(0), est=state_attr(e, 'gas_is_estimate'),
            gen=state_attr(e, 'pv_generation_kwh') | float(0), imp=state_attr(e, 'import_kwh') | float(0),
            exp=state_attr(e, 'export_kwh') | float(0), cyc=state_attr(e, 'battery_cycles') | float(0),
            gchg=state_attr(e, 'grid_charge_kwh') | float(0), hpkwh=state_attr(e, 'hp_electricity_kwh') | float(0),
            month=state_attr(e, 'ledger_month') | float(0), total=state_attr(e, 'ledger_total') | float(0)
          )] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set rows = ns.rows -%}
          {% set cands = rows | selectattr('saving', 'gt', 0) | list %}
          {% if cands | length > 1 %}
          {% set a = cands | sort(attribute='npv', reverse=true) | first %}
          {% set b = cands | sort(attribute='saving', reverse=true) | first %}
          {% set c = cands | sort(attribute='payback') | first %}
          {% set d = cands | sort(attribute='net', reverse=true) | first %}
          🏆 **Best long-term value:** {{ a.name }} - {{ gbp(a.npv) }} net present value
          ⚡ **Biggest saving a year:** {{ b.name }} - {{ gbp(b.saving) }}
          ⏱ **Fastest payback:** {{ c.name }} - {{ (c.payback | round(1) ~ ' years') if c.payback < 99 else 'not within the horizon' }}
          💷 **Best monthly cashflow:** {{ d.name }} - {{ '+' if d.net >= 0 else '-' }}£{{ '{:,.0f}'.format(d.net | abs) }} a month after any finance payments
          {% elif cands | length == 1 %}
          Only **{{ cands[0].name }}** saves money so far. Add another setup (below) to compare.
          {% elif rows | length > 1 %}
          None of the setups saves money yet - check the system costs and kit sizes.
          {% else %}
          The yearly model takes a few seconds after start-up - nothing to compare yet.
          {% endif %}
      - type: markdown
        title: "Your annual energy bill: today vs each setup"
        content: |
          {%- macro bar(v, mx, n=16) -%}{{ '█' * ((v / mx * n) | round(0) | int) if mx > 0 and v > 0 else '' }}{%- endmacro -%}
          {%- macro gbp(v) -%}{{ '-' if v < 0 else '' }}£{{ '{:,.0f}'.format(v | abs) }}{%- endmacro -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for e in integration_entities('energy_twin') | select('match', 'sensor\\..*_annual_saving$') | list -%}
          {%- if states(e) not in ['unknown', 'unavailable'] -%}
          {%- set ns.rows = ns.rows + [dict(
            e=e, name=state_attr(e, 'scenario') or e, saving=states(e) | float(0),
            npv=state_attr(e, 'npv') | float(0), payback=state_attr(e, 'payback_years') | float(99),
            net=state_attr(e, 'monthly_net_cashflow') | float(0), capex=state_attr(e, 'capex') | float(0),
            n10=state_attr(e, 'net_10y') | float(0), cum=state_attr(e, 'cumulative_by_year') or [],
            monthly=state_attr(e, 'monthly') or [], kwh=state_attr(e, 'battery_kwh'), kwp=state_attr(e, 'pv_kwp'),
            pv=state_attr(e, 'pv_saving') | float(0), bat=state_attr(e, 'battery_saving') | float(0),
            hp=state_attr(e, 'hp_saving') | float(0), bill_today=state_attr(e, 'bill_today') | float(0),
            bill_with=state_attr(e, 'bill_with') | float(0), elec_with=state_attr(e, 'elec_with') | float(0),
            gas_with=state_attr(e, 'gas_with') | float(0), elec_today=state_attr(e, 'elec_today') | float(0),
            gas_today=state_attr(e, 'gas_today') | float(0), est=state_attr(e, 'gas_is_estimate'),
            gen=state_attr(e, 'pv_generation_kwh') | float(0), imp=state_attr(e, 'import_kwh') | float(0),
            exp=state_attr(e, 'export_kwh') | float(0), cyc=state_attr(e, 'battery_cycles') | float(0),
            gchg=state_attr(e, 'grid_charge_kwh') | float(0), hpkwh=state_attr(e, 'hp_electricity_kwh') | float(0),
            month=state_attr(e, 'ledger_month') | float(0), total=state_attr(e, 'ledger_total') | float(0)
          )] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set rows = ns.rows -%}
          {% set ref = rows | selectattr('bill_today', 'gt', 0) | list %}
          {% if ref %}
          {% set today = ref[0] %}
          | Setup | Electricity | Gas | **Total / year** | vs today | |
          |---|--:|--:|--:|--:|---|
          | **Today (do nothing)** | {{ gbp(today.elec_today) }} | {{ gbp(today.gas_today) }} | **{{ gbp(today.bill_today) }}** | | {{ bar(today.bill_today, today.bill_today, 20) }} |
          {% for r in ref | sort(attribute='bill_with') -%}
          | **{{ r.name }}** | {{ gbp(r.elec_with) }} | {{ gbp(r.gas_with) }} | **{{ gbp(r.bill_with) }}** | {{ 'no change' if (r.bill_today - r.bill_with) | abs < 1 else (('▼ ' if r.bill_with < r.bill_today else '▲ ') ~ gbp((r.bill_today - r.bill_with) | abs) ~ ' (' ~ ((100 * (r.bill_today - r.bill_with) / r.bill_today) | abs | round(0) | int) ~ '%)') }} | {{ bar(r.bill_with, today.bill_today, 20) }} |
          {% endfor %}

          *Electricity is your bill after solar, battery, car and heat pump; a negative number means export income exceeds what you buy.
          {% if today.est %}The gas bill is an estimate for a typical home until gas and temperature history is available (set the gas sensors under Heat pump data).{% endif %}*
          {% endif %}
      - type: markdown
        title: Scoreboard (ranked by value over the horizon)
        content: |
          {%- macro bar(v, mx, n=16) -%}{{ '█' * ((v / mx * n) | round(0) | int) if mx > 0 and v > 0 else '' }}{%- endmacro -%}
          {%- macro gbp(v) -%}{{ '-' if v < 0 else '' }}£{{ '{:,.0f}'.format(v | abs) }}{%- endmacro -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for e in integration_entities('energy_twin') | select('match', 'sensor\\..*_annual_saving$') | list -%}
          {%- if states(e) not in ['unknown', 'unavailable'] -%}
          {%- set ns.rows = ns.rows + [dict(
            e=e, name=state_attr(e, 'scenario') or e, saving=states(e) | float(0),
            npv=state_attr(e, 'npv') | float(0), payback=state_attr(e, 'payback_years') | float(99),
            net=state_attr(e, 'monthly_net_cashflow') | float(0), capex=state_attr(e, 'capex') | float(0),
            n10=state_attr(e, 'net_10y') | float(0), cum=state_attr(e, 'cumulative_by_year') or [],
            monthly=state_attr(e, 'monthly') or [], kwh=state_attr(e, 'battery_kwh'), kwp=state_attr(e, 'pv_kwp'),
            pv=state_attr(e, 'pv_saving') | float(0), bat=state_attr(e, 'battery_saving') | float(0),
            hp=state_attr(e, 'hp_saving') | float(0), bill_today=state_attr(e, 'bill_today') | float(0),
            bill_with=state_attr(e, 'bill_with') | float(0), elec_with=state_attr(e, 'elec_with') | float(0),
            gas_with=state_attr(e, 'gas_with') | float(0), elec_today=state_attr(e, 'elec_today') | float(0),
            gas_today=state_attr(e, 'gas_today') | float(0), est=state_attr(e, 'gas_is_estimate'),
            gen=state_attr(e, 'pv_generation_kwh') | float(0), imp=state_attr(e, 'import_kwh') | float(0),
            exp=state_attr(e, 'export_kwh') | float(0), cyc=state_attr(e, 'battery_cycles') | float(0),
            gchg=state_attr(e, 'grid_charge_kwh') | float(0), hpkwh=state_attr(e, 'hp_electricity_kwh') | float(0),
            month=state_attr(e, 'ledger_month') | float(0), total=state_attr(e, 'ledger_total') | float(0)
          )] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set rows = ns.rows -%}
          {% if rows %}
          {% set mx = rows | map(attribute='saving') | max %}
          {% set mn = rows | map(attribute='npv') | max %}
          | Setup | Kit | Outlay | Saving / year | | Payback | Net / month | 10-year net | NPV |
          |---|---|--:|--:|---|--:|--:|--:|--:|
          {% for r in rows | sort(attribute='npv', reverse=true) -%}
          | **{{ r.name }}** | {{ r.kwp or 0 }} kWp, {{ r.kwh or 0 }} kWh | {{ gbp(r.capex) }} | {{ gbp(r.saving) }} | {{ bar(r.saving, mx, 12) }} | {{ (r.payback | round(1) ~ ' y') if r.payback < 99 else '—' }} | {{ '-' if r.net < 0 else '' }}{{ gbp(r.net | abs) }} | {{ '-' if r.n10 < 0 else '' }}{{ gbp(r.n10 | abs) }} | {{ '-' if r.npv < 0 else '' }}{{ gbp(r.npv | abs) }}{{ ' 🏆' if r.npv == mn else '' }} |
          {% endfor %}
          {% endif %}
      - type: markdown
        title: Where the saving comes from
        content: |
          {%- macro bar(v, mx, n=16) -%}{{ '█' * ((v / mx * n) | round(0) | int) if mx > 0 and v > 0 else '' }}{%- endmacro -%}
          {%- macro gbp(v) -%}{{ '-' if v < 0 else '' }}£{{ '{:,.0f}'.format(v | abs) }}{%- endmacro -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for e in integration_entities('energy_twin') | select('match', 'sensor\\..*_annual_saving$') | list -%}
          {%- if states(e) not in ['unknown', 'unavailable'] -%}
          {%- set ns.rows = ns.rows + [dict(
            e=e, name=state_attr(e, 'scenario') or e, saving=states(e) | float(0),
            npv=state_attr(e, 'npv') | float(0), payback=state_attr(e, 'payback_years') | float(99),
            net=state_attr(e, 'monthly_net_cashflow') | float(0), capex=state_attr(e, 'capex') | float(0),
            n10=state_attr(e, 'net_10y') | float(0), cum=state_attr(e, 'cumulative_by_year') or [],
            monthly=state_attr(e, 'monthly') or [], kwh=state_attr(e, 'battery_kwh'), kwp=state_attr(e, 'pv_kwp'),
            pv=state_attr(e, 'pv_saving') | float(0), bat=state_attr(e, 'battery_saving') | float(0),
            hp=state_attr(e, 'hp_saving') | float(0), bill_today=state_attr(e, 'bill_today') | float(0),
            bill_with=state_attr(e, 'bill_with') | float(0), elec_with=state_attr(e, 'elec_with') | float(0),
            gas_with=state_attr(e, 'gas_with') | float(0), elec_today=state_attr(e, 'elec_today') | float(0),
            gas_today=state_attr(e, 'gas_today') | float(0), est=state_attr(e, 'gas_is_estimate'),
            gen=state_attr(e, 'pv_generation_kwh') | float(0), imp=state_attr(e, 'import_kwh') | float(0),
            exp=state_attr(e, 'export_kwh') | float(0), cyc=state_attr(e, 'battery_cycles') | float(0),
            gchg=state_attr(e, 'grid_charge_kwh') | float(0), hpkwh=state_attr(e, 'hp_electricity_kwh') | float(0),
            month=state_attr(e, 'ledger_month') | float(0), total=state_attr(e, 'ledger_total') | float(0)
          )] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set rows = ns.rows -%}
          {% if rows %}
          {% set mx = rows | map(attribute='saving') | max %}
          | Setup | ☀️ Solar | 🔋 Battery | 🔥 Heat pump & hob | **Total** | |
          |---|--:|--:|--:|--:|---|
          {% for r in rows | sort(attribute='saving', reverse=true) -%}
          | **{{ r.name }}** | {{ gbp(r.pv) }} | {{ gbp(r.bat) }} | {{ gbp(r.hp) if (r.hp != 0) else '—' }} | **{{ gbp(r.saving) }}** | {{ bar(r.saving, mx, 14) }} |
          {% endfor %}

          *Solar and battery are measured with any heat pump load in the house, which is why the same kit saves more alongside one.
          Heat pump = gas avoided minus the extra electricity it needs.*
          {% endif %}
      - type: markdown
        title: "Payback race: cumulative net position"
        content: |
          {%- macro bar(v, mx, n=16) -%}{{ '█' * ((v / mx * n) | round(0) | int) if mx > 0 and v > 0 else '' }}{%- endmacro -%}
          {%- macro gbp(v) -%}{{ '-' if v < 0 else '' }}£{{ '{:,.0f}'.format(v | abs) }}{%- endmacro -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for e in integration_entities('energy_twin') | select('match', 'sensor\\..*_annual_saving$') | list -%}
          {%- if states(e) not in ['unknown', 'unavailable'] -%}
          {%- set ns.rows = ns.rows + [dict(
            e=e, name=state_attr(e, 'scenario') or e, saving=states(e) | float(0),
            npv=state_attr(e, 'npv') | float(0), payback=state_attr(e, 'payback_years') | float(99),
            net=state_attr(e, 'monthly_net_cashflow') | float(0), capex=state_attr(e, 'capex') | float(0),
            n10=state_attr(e, 'net_10y') | float(0), cum=state_attr(e, 'cumulative_by_year') or [],
            monthly=state_attr(e, 'monthly') or [], kwh=state_attr(e, 'battery_kwh'), kwp=state_attr(e, 'pv_kwp'),
            pv=state_attr(e, 'pv_saving') | float(0), bat=state_attr(e, 'battery_saving') | float(0),
            hp=state_attr(e, 'hp_saving') | float(0), bill_today=state_attr(e, 'bill_today') | float(0),
            bill_with=state_attr(e, 'bill_with') | float(0), elec_with=state_attr(e, 'elec_with') | float(0),
            gas_with=state_attr(e, 'gas_with') | float(0), elec_today=state_attr(e, 'elec_today') | float(0),
            gas_today=state_attr(e, 'gas_today') | float(0), est=state_attr(e, 'gas_is_estimate'),
            gen=state_attr(e, 'pv_generation_kwh') | float(0), imp=state_attr(e, 'import_kwh') | float(0),
            exp=state_attr(e, 'export_kwh') | float(0), cyc=state_attr(e, 'battery_cycles') | float(0),
            gchg=state_attr(e, 'grid_charge_kwh') | float(0), hpkwh=state_attr(e, 'hp_electricity_kwh') | float(0),
            month=state_attr(e, 'ledger_month') | float(0), total=state_attr(e, 'ledger_total') | float(0)
          )] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set rows = ns.rows -%}
          {%- set ys = [1, 2, 3, 5, 7, 10, 15, 20] -%}
          {%- if rows -%}
          {%- set h = namespace(a='| Year |', b='|---|') -%}
          {%- for r in rows -%}{%- set h.a = h.a ~ ' ' ~ r.name ~ ' |' -%}{%- set h.b = h.b ~ '--:|' -%}{%- endfor -%}
          {{ h.a }}
          {{ h.b }}
          {%- for y in ys -%}
          {%- set ln = namespace(t='| ' ~ y ~ ' |') -%}
          {%- for r in rows -%}
          {%- if r.cum | length >= y -%}{%- set v = r.cum[y - 1] -%}{%- set cell = ('✅ ' if v >= 0 else '❌ ') ~ ('-' if v < 0 else '') ~ gbp(v | abs) -%}{%- else -%}{%- set cell = '—' -%}{%- endif -%}
          {%- set ln.t = ln.t ~ ' ' ~ cell ~ ' |' -%}
          {%- endfor -%}
          {{ '\n' ~ ln.t }}
          {%- endfor %}

          *✅ = this setup has paid for itself by then (cumulative savings minus outlay and finance, with tariff inflation and degradation).*
          {%- endif -%}
      - type: markdown
        title: Month by month saving (🏆 = best that month)
        content: |
          {%- macro bar(v, mx, n=16) -%}{{ '█' * ((v / mx * n) | round(0) | int) if mx > 0 and v > 0 else '' }}{%- endmacro -%}
          {%- macro gbp(v) -%}{{ '-' if v < 0 else '' }}£{{ '{:,.0f}'.format(v | abs) }}{%- endmacro -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for e in integration_entities('energy_twin') | select('match', 'sensor\\..*_annual_saving$') | list -%}
          {%- if states(e) not in ['unknown', 'unavailable'] -%}
          {%- set ns.rows = ns.rows + [dict(
            e=e, name=state_attr(e, 'scenario') or e, saving=states(e) | float(0),
            npv=state_attr(e, 'npv') | float(0), payback=state_attr(e, 'payback_years') | float(99),
            net=state_attr(e, 'monthly_net_cashflow') | float(0), capex=state_attr(e, 'capex') | float(0),
            n10=state_attr(e, 'net_10y') | float(0), cum=state_attr(e, 'cumulative_by_year') or [],
            monthly=state_attr(e, 'monthly') or [], kwh=state_attr(e, 'battery_kwh'), kwp=state_attr(e, 'pv_kwp'),
            pv=state_attr(e, 'pv_saving') | float(0), bat=state_attr(e, 'battery_saving') | float(0),
            hp=state_attr(e, 'hp_saving') | float(0), bill_today=state_attr(e, 'bill_today') | float(0),
            bill_with=state_attr(e, 'bill_with') | float(0), elec_with=state_attr(e, 'elec_with') | float(0),
            gas_with=state_attr(e, 'gas_with') | float(0), elec_today=state_attr(e, 'elec_today') | float(0),
            gas_today=state_attr(e, 'gas_today') | float(0), est=state_attr(e, 'gas_is_estimate'),
            gen=state_attr(e, 'pv_generation_kwh') | float(0), imp=state_attr(e, 'import_kwh') | float(0),
            exp=state_attr(e, 'export_kwh') | float(0), cyc=state_attr(e, 'battery_cycles') | float(0),
            gchg=state_attr(e, 'grid_charge_kwh') | float(0), hpkwh=state_attr(e, 'hp_electricity_kwh') | float(0),
            month=state_attr(e, 'ledger_month') | float(0), total=state_attr(e, 'ledger_total') | float(0)
          )] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set rows = ns.rows -%}
          {%- if rows and rows[0].monthly -%}
          {%- set h = namespace(a='| Month |', b='|---|') -%}
          {%- for r in rows -%}{%- set h.a = h.a ~ ' ' ~ r.name ~ ' |' -%}{%- set h.b = h.b ~ '--:|' -%}{%- endfor -%}
          {{ h.a }}
          {{ h.b }}
          {%- for k in range(rows[0].monthly | length) -%}
          {%- set best = namespace(v=-99999) -%}
          {%- for r in rows -%}{%- if r.monthly | length > k and r.monthly[k].saving > best.v -%}{%- set best.v = r.monthly[k].saving -%}{%- endif -%}{%- endfor -%}
          {%- set ln = namespace(t='| ' ~ rows[0].monthly[k].month ~ ' |') -%}
          {%- for r in rows -%}
          {%- if r.monthly | length > k -%}{%- set m = r.monthly[k] -%}{%- set cell = ('🏆 ' if (rows | length > 1 and m.saving == best.v) else '') ~ ('-' if m.saving < 0 else '') ~ gbp(m.saving | abs) -%}{%- else -%}{%- set cell = '—' -%}{%- endif -%}
          {%- set ln.t = ln.t ~ ' ' ~ cell ~ ' |' -%}
          {%- endfor -%}
          {{ '\n' ~ ln.t }}
          {%- endfor -%}
          {%- endif -%}
      - type: markdown
        title: Energy flows per year
        content: |
          {%- macro bar(v, mx, n=16) -%}{{ '█' * ((v / mx * n) | round(0) | int) if mx > 0 and v > 0 else '' }}{%- endmacro -%}
          {%- macro gbp(v) -%}{{ '-' if v < 0 else '' }}£{{ '{:,.0f}'.format(v | abs) }}{%- endmacro -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for e in integration_entities('energy_twin') | select('match', 'sensor\\..*_annual_saving$') | list -%}
          {%- if states(e) not in ['unknown', 'unavailable'] -%}
          {%- set ns.rows = ns.rows + [dict(
            e=e, name=state_attr(e, 'scenario') or e, saving=states(e) | float(0),
            npv=state_attr(e, 'npv') | float(0), payback=state_attr(e, 'payback_years') | float(99),
            net=state_attr(e, 'monthly_net_cashflow') | float(0), capex=state_attr(e, 'capex') | float(0),
            n10=state_attr(e, 'net_10y') | float(0), cum=state_attr(e, 'cumulative_by_year') or [],
            monthly=state_attr(e, 'monthly') or [], kwh=state_attr(e, 'battery_kwh'), kwp=state_attr(e, 'pv_kwp'),
            pv=state_attr(e, 'pv_saving') | float(0), bat=state_attr(e, 'battery_saving') | float(0),
            hp=state_attr(e, 'hp_saving') | float(0), bill_today=state_attr(e, 'bill_today') | float(0),
            bill_with=state_attr(e, 'bill_with') | float(0), elec_with=state_attr(e, 'elec_with') | float(0),
            gas_with=state_attr(e, 'gas_with') | float(0), elec_today=state_attr(e, 'elec_today') | float(0),
            gas_today=state_attr(e, 'gas_today') | float(0), est=state_attr(e, 'gas_is_estimate'),
            gen=state_attr(e, 'pv_generation_kwh') | float(0), imp=state_attr(e, 'import_kwh') | float(0),
            exp=state_attr(e, 'export_kwh') | float(0), cyc=state_attr(e, 'battery_cycles') | float(0),
            gchg=state_attr(e, 'grid_charge_kwh') | float(0), hpkwh=state_attr(e, 'hp_electricity_kwh') | float(0),
            month=state_attr(e, 'ledger_month') | float(0), total=state_attr(e, 'ledger_total') | float(0)
          )] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set rows = ns.rows -%}
          {% if rows %}
          | Setup | Solar generated | Bought from grid | Exported | Battery cycles | Cheap-rate grid charging | Heat pump electricity |
          |---|--:|--:|--:|--:|--:|--:|
          {% for r in rows -%}
          | **{{ r.name }}** | {{ '{:,.0f}'.format(r.gen) }} kWh | {{ '{:,.0f}'.format(r.imp) }} kWh | {{ '{:,.0f}'.format(r.exp) }} kWh | {{ r.cyc | round(0) | int }} | {{ '{:,.0f}'.format(r.gchg) }} kWh | {{ ('{:,.0f}'.format(r.hpkwh) ~ ' kWh') if r.hpkwh else '—' }} |
          {% endfor %}
          {% endif %}
      - type: markdown
        title: What each would have saved you so far (live ledger)
        content: |
          {%- macro bar(v, mx, n=16) -%}{{ '█' * ((v / mx * n) | round(0) | int) if mx > 0 and v > 0 else '' }}{%- endmacro -%}
          {%- macro gbp(v) -%}{{ '-' if v < 0 else '' }}£{{ '{:,.0f}'.format(v | abs) }}{%- endmacro -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for e in integration_entities('energy_twin') | select('match', 'sensor\\..*_annual_saving$') | list -%}
          {%- if states(e) not in ['unknown', 'unavailable'] -%}
          {%- set ns.rows = ns.rows + [dict(
            e=e, name=state_attr(e, 'scenario') or e, saving=states(e) | float(0),
            npv=state_attr(e, 'npv') | float(0), payback=state_attr(e, 'payback_years') | float(99),
            net=state_attr(e, 'monthly_net_cashflow') | float(0), capex=state_attr(e, 'capex') | float(0),
            n10=state_attr(e, 'net_10y') | float(0), cum=state_attr(e, 'cumulative_by_year') or [],
            monthly=state_attr(e, 'monthly') or [], kwh=state_attr(e, 'battery_kwh'), kwp=state_attr(e, 'pv_kwp'),
            pv=state_attr(e, 'pv_saving') | float(0), bat=state_attr(e, 'battery_saving') | float(0),
            hp=state_attr(e, 'hp_saving') | float(0), bill_today=state_attr(e, 'bill_today') | float(0),
            bill_with=state_attr(e, 'bill_with') | float(0), elec_with=state_attr(e, 'elec_with') | float(0),
            gas_with=state_attr(e, 'gas_with') | float(0), elec_today=state_attr(e, 'elec_today') | float(0),
            gas_today=state_attr(e, 'gas_today') | float(0), est=state_attr(e, 'gas_is_estimate'),
            gen=state_attr(e, 'pv_generation_kwh') | float(0), imp=state_attr(e, 'import_kwh') | float(0),
            exp=state_attr(e, 'export_kwh') | float(0), cyc=state_attr(e, 'battery_cycles') | float(0),
            gchg=state_attr(e, 'grid_charge_kwh') | float(0), hpkwh=state_attr(e, 'hp_electricity_kwh') | float(0),
            month=state_attr(e, 'ledger_month') | float(0), total=state_attr(e, 'ledger_total') | float(0)
          )] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set rows = ns.rows -%}
          {% if rows %}
          | Setup | This month | Since started |
          |---|--:|--:|
          {% for r in rows | sort(attribute='total', reverse=true) -%}
          | **{{ r.name }}** | £{{ r.month }} | £{{ r.total }} |
          {% endfor %}

          All setups see the same real load, prices, forecast and Power Up/Down events, so differences come purely from the kit, heat pump and strategy.
          {% endif %}
      - type: markdown
        content: |
          **Add a setup to compare:** *Settings → Devices & services → Home Energy Twin → Add entry*. Name it (e.g. "16 kWh + 6 kWp"),
          choose *Copy settings from* to reuse your entities, pick a hardware preset, then tweak. Each setup runs its own
          virtual battery against your real home. For a sweep of sizes within one setup use the *Size sweep* tab.

  # ───────────────────────────── 1. LIVE TWIN ─────────────────────────────
  - title: Live twin
    path: live
    icon: mdi:home-lightning-bolt
    cards:
      - type: markdown
        content: |
          {%- macro ent(sfx) -%}{%- set m = integration_entities('energy_twin') | select('match', 'sensor\\..*_' ~ sfx ~ '$') | list -%}{%- set c = 'sensor.home_energy_twin_' ~ sfx -%}{{ c if c in m else (m[0] if m else c) }}{%- endmacro -%}
          ## Virtual battery: **{{ states(ent('twin_mode')) }}**

          This is a *simulation* of the kit you configured, stepped against your real
          Home Mini load. Nothing here controls real hardware.
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.home_energy_twin_battery_state_of_charge
            name: Virtual battery
            min: 0
            max: 100
            needle: true
            severity: {red: 0, yellow: 15, green: 35}
          - type: gauge
            entity: sensor.home_energy_twin_planned_overnight_charge_target
            name: Tonight's charge target
            min: 0
            max: 100
      - type: entities
        title: Virtual battery
        show_header_toggle: false
        entities:
          - {entity: number.home_energy_twin_set_battery_level, name: Set level (%)}
          - {entity: button.home_energy_twin_reset_virtual_battery, name: Reset to starting level}
      - type: markdown
        title: Right now - how the numbers add up
        content: |
          {%- macro ent(sfx) -%}{%- set m = integration_entities('energy_twin') | select('match', 'sensor\\..*_' ~ sfx ~ '$') | list -%}{%- set c = 'sensor.home_energy_twin_' ~ sfx -%}{{ c if c in m else (m[0] if m else c) }}{%- endmacro -%}
          {% set load = states(ent('home_load_meter')) | float(0) %}
          {% set mod = states(ent('modelled_extra_load')) | float(0) %}
          {% set sol = states(ent('solar_power')) | float(0) %}
          {% set bat = states(ent('battery_power')) | float(0) %}
          {% set imp = states(ent('grid_import')) | float(0) %}
          {% set exp = states(ent('grid_export')) | float(0) %}
          | | kW |
          |---|--:|
          | **Your home, from the real meter** (house {{ state_attr(ent('home_load_meter'), 'house_kw') }} + car {{ state_attr(ent('home_load_meter'), 'car_kw') }}) | **{{ load }}** |
          | + Heat pump & hob (modelled - not on your meter yet) | {{ mod }} |
          | − Solar (modelled) | {{ sol }} |
          | {{ '+ Battery charging' if bat >= 0 else '− Battery discharging' }} | {{ bat | abs }} |
          | **= Grid with the kit** | **{{ ((load + mod - sol + bat) | round(2)) }}** |
          | → Importing | {{ imp }} |
          | → Exporting | {{ exp }} |

          {{ states(ent('twin_mode')) }}.
          The twin's load is your real meter **plus** any modelled heat pump / hob load (switched on under *Heat pump*).
          Grid import is **0 whenever the virtual battery or solar covers your load** - e.g. after the overnight charge
          the battery runs the house until its usable energy is used. The first row is what you really draw today.
      - type: grid
        columns: 3
        square: false
        cards:
          - {type: tile, entity: sensor.home_energy_twin_home_load_meter, name: Home load (real)}
          - {type: tile, entity: sensor.home_energy_twin_modelled_extra_load, name: Heat pump + hob (modelled)}
          - {type: tile, entity: sensor.home_energy_twin_solar_power, name: Solar (modelled)}
          - {type: tile, entity: sensor.home_energy_twin_battery_power, name: Battery (+charge)}
          - {type: tile, entity: sensor.home_energy_twin_grid_import, name: Grid import}
          - {type: tile, entity: sensor.home_energy_twin_grid_export, name: Grid export}
          - {type: tile, entity: sensor.home_energy_twin_grid_power, name: Grid net (+import)}
          - {type: tile, entity: sensor.home_energy_twin_import_price, name: Import price}
          - {type: tile, entity: sensor.home_energy_twin_export_price, name: Export price}
          - {type: tile, entity: sensor.home_energy_twin_main_fuse_usage_plan_peak, name: Fuse used (plan peak)}
      - type: entities
        title: What it would have saved you
        entities:
          - {entity: sensor.home_energy_twin_saving_today, name: Today}
          - {entity: sensor.home_energy_twin_saving_this_month, name: This month}
          - {entity: sensor.home_energy_twin_saving_total, name: Since twin started}
          - {entity: sensor.home_energy_twin_cost_today_actual, name: Today's real bill}
          - {entity: sensor.home_energy_twin_cost_today_twin, name: Today's bill with kit}
          - {entity: sensor.home_energy_twin_home_usage_today, name: Home usage today (follows your Octopus meter)}
          - {entity: sensor.home_energy_twin_solar_generated_today, name: Solar generated today}
          - {entity: sensor.home_energy_twin_imported_today, name: Imported today (with the kit)}
          - {entity: sensor.home_energy_twin_exported_today, name: Exported today}
      - type: custom:apexcharts-card
        header:
          show: true
          title: Plan for the next ~33 hours
          show_states: false
        graph_span: 36h
        span: {start: hour}
        now: {show: true, label: Now}
        yaxis:
          - {id: kw, decimals: 1, apex_config: {title: {text: kW}}}
          - {id: pct, opposite: true, min: 0, max: 100, decimals: 0, apex_config: {title: {text: "SoC %"}}}
          - {id: p, show: false, decimals: 0}
        apex_config:
          chart: {height: 320}
          stroke: {width: [0, 2, 2, 2, 1]}
        series:
          - entity: sensor.home_energy_twin_planned_overnight_charge_target
            name: Battery kW (+charge / -discharge)
            type: column
            yaxis_id: kw
            color: "#2e7d32"
            data_generator: |
              const s = entity.attributes.series; if (!s) return [];
              return s.t.map((t, i) => [t, s.battery_kw[i]]);
          - entity: sensor.home_energy_twin_planned_overnight_charge_target
            name: Grid kW (+import)
            type: line
            curve: stepline
            yaxis_id: kw
            color: "#c62828"
            data_generator: |
              const s = entity.attributes.series; if (!s) return [];
              return s.t.map((t, i) => [t, s.grid_kw[i]]);
          - entity: sensor.home_energy_twin_planned_overnight_charge_target
            name: Solar kW
            type: area
            curve: smooth
            yaxis_id: kw
            color: "#f9a825"
            opacity: 0.25
            data_generator: |
              const s = entity.attributes.series; if (!s) return [];
              return s.t.map((t, i) => [t, s.pv_kw[i]]);
          - entity: sensor.home_energy_twin_planned_overnight_charge_target
            name: Battery SoC %
            type: line
            curve: smooth
            yaxis_id: pct
            color: "#1565c0"
            data_generator: |
              const s = entity.attributes.series; if (!s) return [];
              return s.t.map((t, i) => [t, s.soc_pct[i]]);
          - entity: sensor.home_energy_twin_planned_overnight_charge_target
            name: Import price p/kWh
            type: line
            curve: stepline
            yaxis_id: p
            color: "#6d4c41"
            stroke_width: 1
            data_generator: |
              const s = entity.attributes.series; if (!s) return [];
              return s.t.map((t, i) => [t, s.import_p[i]]);
      - type: entities
        title: Plan summary
        entities:
          - {entity: sensor.home_energy_twin_planned_battery_export, name: Planned export from battery}
          - {entity: sensor.home_energy_twin_plan_saving_next_day, name: Plan saving vs no kit}
          - {entity: sensor.home_energy_twin_next_power_event, name: Next Power Up/Down}
          - {entity: sensor.home_energy_twin_ev_charging_expected_tonight, name: EV charging expected tonight}

  # ───────────────────────────── 2. WHAT-IF ─────────────────────────────
  - title: What-if
    path: whatif
    icon: mdi:calculator-variant
    cards:
      - type: entities
        title: Try some kit
        show_header_toggle: false
        entities:
          - select.home_energy_twin_hardware_preset
          - number.home_energy_twin_solar_array_size
          - number.home_energy_twin_battery_capacity
          - number.home_energy_twin_inverter_size
          - number.home_energy_twin_battery_max_power
          - number.home_energy_twin_battery_reserve
          - number.home_energy_twin_export_limit
          - number.home_energy_twin_annual_yield_per_kwp
      - type: entities
        title: Strategy & prices
        show_header_toggle: false
        entities:
          - select.home_energy_twin_strategy
          - switch.home_energy_twin_grid_to_export_arbitrage
          - switch.home_energy_twin_allow_battery_export
          - number.home_energy_twin_cheap_import_rate
          - number.home_energy_twin_standard_import_rate
          - number.home_energy_twin_export_rate
          - number.home_energy_twin_assumed_power_downs_per_month
          - number.home_energy_twin_assumed_power_ups_per_month
      - type: entities
        title: Cost & finance
        show_header_toggle: false
        entities:
          - number.home_energy_twin_system_cost
          - number.home_energy_twin_grant
          - select.home_energy_twin_how_you_pay
          - number.home_energy_twin_finance_deposit
          - number.home_energy_twin_loan_interest_rate
          - number.home_energy_twin_finance_term
          - number.home_energy_twin_fixed_monthly_payment
          - {entity: button.home_energy_twin_recalculate_annual_what_if, name: Recalculate year}
      - type: horizontal-stack
        cards:
          - {type: tile, entity: sensor.home_energy_twin_annual_saving, name: Saving / year}
          - {type: tile, entity: sensor.home_energy_twin_payback, name: Payback}
          - {type: tile, entity: sensor.home_energy_twin_outlay, name: Outlay}
      - type: horizontal-stack
        cards:
          - {type: tile, entity: sensor.home_energy_twin_annual_saving_from_solar, name: …from solar}
          - {type: tile, entity: sensor.home_energy_twin_annual_saving_from_battery, name: …from battery}
          - {type: tile, entity: sensor.home_energy_twin_monthly_net_cashflow, name: Net / month}
      - type: markdown
        title: Cash vs finance
        content: |
          {%- macro ent(sfx) -%}{%- set m = integration_entities('energy_twin') | select('match', 'sensor\\..*_' ~ sfx ~ '$') | list -%}{%- set c = 'sensor.home_energy_twin_' ~ sfx -%}{{ c if c in m else (m[0] if m else c) }}{%- endmacro -%}
          | | |
          |---|---|
          | Outlay | £{{ states(ent('outlay')) }} |
          | Saving in year 1 | £{{ states(ent('annual_saving')) }} |
          | Finance payment | £{{ states(ent('monthly_finance_payment')) }} / month |
          {%- if state_attr(ent('annual_saving'), 'effective_apr_pct') is not none %}
          | Interest rate you are really paying | {{ state_attr(ent('annual_saving'), 'effective_apr_pct') }}% |
          | Total cost of finance (interest + fees) | £{{ state_attr(ent('annual_saving'), 'cost_of_finance') }} |
          {%- endif %}
          | **Net cashflow** | **£{{ states(ent('monthly_net_cashflow')) }} / month** |
          | Payback (with tariff inflation, degradation) | {{ states(ent('payback')) }} years |
          | Simple payback | {{ state_attr(ent('payback'), 'simple_payback_years') }} years |
          | Net gain over horizon | £{{ states(ent('net_gain_over_horizon')) }} |
          | NPV | £{{ states(ent('net_present_value')) }} |

          *Model: {{ state_attr(ent('annual_saving'), 'strategy') }} strategy, load profile
          {{ state_attr(ent('annual_saving'), 'profile') }}.*
      - type: markdown
        title: Month by month (baseline vs with kit)
        content: |
          {%- macro ent(sfx) -%}{%- set m = integration_entities('energy_twin') | select('match', 'sensor\\..*_' ~ sfx ~ '$') | list -%}{%- set c = 'sensor.home_energy_twin_' ~ sfx -%}{{ c if c in m else (m[0] if m else c) }}{%- endmacro -%}
          {% set m = state_attr(ent('annual_saving'), 'monthly') %}
          {% if m %}
          | Month | Without | With | **Saved** |
          |---|--:|--:|--:|
          {% for r in m -%}
          | {{ r.month }} | £{{ r.baseline }} | £{{ r.scenario }} | **£{{ r.saving }}** |
          {% endfor %}
          {% else %}Annual model still calculating…{% endif %}

  # ───────────────────────────── HEAT PUMP ─────────────────────────────
  - title: Heat pump
    path: heatpump
    icon: mdi:heat-pump
    cards:
      - type: entities
        title: Heat pump & induction hob (modelled - nothing is installed yet)
        show_header_toggle: false
        entities:
          - switch.home_energy_twin_model_heat_pump_induction
          - switch.home_energy_twin_disconnect_gas
          - number.home_energy_twin_hot_water_tank_size
          - number.home_energy_twin_heat_pump_capacity
          - number.home_energy_twin_gas_unit_rate
          - number.home_energy_twin_main_fuse
      - type: grid
        columns: 3
        square: false
        cards:
          - {type: tile, entity: sensor.home_energy_twin_heat_pump_power, name: Heat pump now}
          - {type: tile, entity: sensor.home_energy_twin_hot_water_tank_temperature_est, name: Tank (est.)}
          - {type: tile, entity: sensor.home_energy_twin_annual_heat_pump_saving, name: Saving / year}
          - {type: tile, entity: sensor.home_energy_twin_peak_grid_import_plan, name: Plan peak import}
          - {type: tile, entity: sensor.home_energy_twin_main_fuse_usage_plan_peak, name: Fuse used at peak}
      - type: markdown
        title: What the heat pump does to your bills (per year)
        content: |
          {%- macro ent(sfx) -%}{%- set m = integration_entities('energy_twin') | select('match', 'sensor\\..*_' ~ sfx ~ '$') | list -%}{%- set c = 'sensor.home_energy_twin_' ~ sfx -%}{{ c if c in m else (m[0] if m else c) }}{%- endmacro -%}
          {% set s = ent('annual_heat_pump_saving') %}
          {% if state_attr(s, 'hp_electricity_kwh') is not none %}
          | | |
          |---|--:|
          | Gas no longer burned | {{ state_attr(s, 'gas_kwh_displaced') }} kWh |
          | Gas cost avoided | £{{ state_attr(s, 'gas_cost_avoided') }} |
          | Gas standing charge avoided | £{{ state_attr(s, 'gas_standing_avoided') }} |
          | Extra electricity | {{ state_attr(s, 'hp_electricity_kwh') }} kWh (+{{ state_attr(s, 'induction_kwh') }} induction) |
          | Cost of that electricity (no solar/battery) | £{{ state_attr(s, 'hp_grid_cost') }} |
          | **Net saving** | **£{{ states(s) }}** |
          | Seasonal COP: heating / hot water | {{ state_attr(s, 'scop_space') }} / {{ state_attr(s, 'scop_dhw') }} |
          | Electricity used in cheap slots | {{ state_attr(s, 'cheap_share_pct') }}% |
          | Resistive backup (heat pump too small) | {{ state_attr(s, 'backup_electricity_kwh') }} kWh |

          *Gas split: {{ state_attr(s, 'gas_model').source if state_attr(s, 'gas_model') else '?' }}
          ({{ state_attr(s, 'gas_model').days if state_attr(s, 'gas_model') else 0 }} days of gas + temperature history).
          With no history it uses typical figures. Treat the result as a range: COP, flow temperature and sizing all matter.*
          {% else %}Switch the heat pump model on (above), then wait a few seconds for the yearly model.{% endif %}
      - type: custom:apexcharts-card
        header: {show: true, title: Heat pump & hot water tank - next ~33 hours, show_states: false}
        graph_span: 36h
        span: {start: hour}
        now: {show: true, label: Now}
        yaxis:
          - {id: kw, decimals: 1, apex_config: {title: {text: kW}}}
          - {id: pct, opposite: true, min: 0, max: 100, decimals: 0, apex_config: {title: {text: "Tank %"}}}
        apex_config:
          chart: {height: 280}
        series:
          - entity: sensor.home_energy_twin_planned_overnight_charge_target
            name: Heat pump kW
            type: column
            yaxis_id: kw
            color: "#e65100"
            data_generator: |
              const s = entity.attributes.series; if (!s || !s.hp_kw) return [];
              return s.t.map((t, i) => [t, s.hp_kw[i]]);
          - entity: sensor.home_energy_twin_planned_overnight_charge_target
            name: Tank energy %
            type: line
            curve: smooth
            yaxis_id: pct
            color: "#00838f"
            data_generator: |
              const s = entity.attributes.series; if (!s || !s.tank_pct) return [];
              return s.t.map((t, i) => [t, s.tank_pct[i]]);
          - entity: sensor.home_energy_twin_planned_overnight_charge_target
            name: Import price p/kWh
            type: line
            curve: stepline
            yaxis_id: kw
            color: "#6d4c41"
            stroke_width: 1
            data_generator: |
              const s = entity.attributes.series; if (!s) return [];
              return s.t.map((t, i) => [t, s.import_p[i] / 10]);

  # ───────────────────────────── 3. SIZE SWEEP ─────────────────────────────
  - title: Size sweep
    path: sweep
    icon: mdi:chart-bubble
    cards:
      - type: entities
        entities:
          - {entity: button.home_energy_twin_run_size_sweep, name: Run default sweep (rules engine, ~seconds)}
          - {entity: sensor.home_energy_twin_best_sweep_result, name: Best by annual saving}
      - type: markdown
        title: Ranked by saving per year
        content: |
          {%- macro ent(sfx) -%}{%- set m = integration_entities('energy_twin') | select('match', 'sensor\\..*_' ~ sfx ~ '$') | list -%}{%- set c = 'sensor.home_energy_twin_' ~ sfx -%}{{ c if c in m else (m[0] if m else c) }}{%- endmacro -%}
          {% set rows = state_attr(ent('best_sweep_result'), 'rows') %}
          {% if rows %}
          | kWp | kWh | Inv kW | **Saving / year** | Last battery step | per extra kWh | Last array step | per extra kWp | Peak import |
          |--:|--:|--:|--:|--:|--:|--:|--:|--:|
          {% for r in rows -%}
          | {{ r.pv_kwp }} | {{ r.battery_kwh }} | {{ r.inverter_kw }} | **£{{ r.saving_year1 | round(0) | int }}** | {{ ('+£' ~ (r.battery_step_gain | round(0) | int)) if r.battery_step_gain is defined else '—' }} | {{ ('£' ~ r.battery_gain_per_kwh) if r.battery_gain_per_kwh is defined else '—' }} | {{ ('+£' ~ (r.array_step_gain | round(0) | int)) if r.array_step_gain is defined else '—' }} | {{ ('£' ~ r.array_gain_per_kwp) if r.array_gain_per_kwp is defined else '—' }} | {{ r.peak_import_kw }} kW |
          {% endfor %}

          *There's no price here on purpose - each setup has one system cost. Use the step columns to judge a quote: if a bigger
          battery costs £1,500 more and adds £90 a year, it takes about 17 years to pay back the difference.*
          {% else %}Press **Run size sweep**. For custom grids call the
          `energy_twin.run_sweep` service (battery_kwh, pv_kwp, inverter_kw lists).{% endif %}

  # ───────────────────────────── 4. POWER UP / DOWN ─────────────────────────────
  - title: Octopus events
    path: events
    icon: mdi:flash-alert
    cards:
      - type: markdown
        content: |
          Events seen from your Octopus entities appear automatically. To add one by hand, fill in
          the form below and press **Add event**.

          **Power Up** = charge everything. **Power Down** = run on battery and export.
          The rate is optional: for Power Up it overrides the import rate, for Power Down the
          export rate (0 = use the defaults from the integration's Tariff options).
      - type: entities
        title: Add an event
        show_header_toggle: false
        entities:
          - select.home_energy_twin_event_type
          - datetime.home_energy_twin_event_start
          - datetime.home_energy_twin_event_end
          - number.home_energy_twin_event_rate_override
          - button.home_energy_twin_add_event
          - button.home_energy_twin_clear_manual_events
      - type: markdown
        title: Known events
        content: |
          {%- macro ent(sfx) -%}{%- set m = integration_entities('energy_twin') | select('match', 'sensor\\..*_' ~ sfx ~ '$') | list -%}{%- set c = 'sensor.home_energy_twin_' ~ sfx -%}{{ c if c in m else (m[0] if m else c) }}{%- endmacro -%}
          {% set ev = state_attr(ent('next_power_event'), 'events') %}
          {% if ev %}{% for e in ev -%}
          - **{{ e.kind }}** {{ as_timestamp(e.start) | timestamp_custom('%a %d %b %H:%M') }} → {{ as_timestamp(e.end) | timestamp_custom('%H:%M') }}
          {% endfor %}{% else %}None right now.{% endif %}

  # ───────────────────────────── 5. SETUP ─────────────────────────────
  - title: Diagnostics
    path: diagnostics
    icon: mdi:stethoscope
    cards:
      - type: markdown
        content: |
          {%- macro ent(sfx) -%}{%- set m = integration_entities('energy_twin') | select('match', 'sensor\\..*_' ~ sfx ~ '$') | list -%}{%- set c = 'sensor.home_energy_twin_' ~ sfx -%}{{ c if c in m else (m[0] if m else c) }}{%- endmacro -%}
          {% set d = state_attr(ent('diagnostics'), 'diagnostics') %}
          {% if d %}{% for k, v in d.items() -%}
          - **{{ k }}**: {{ v }}
          {% endfor %}{% endif %}

          If *import_rate_slots* is 0, check the Octopus rate entities selected in the
          integration's options. If *forecast_slots_used* is 0, the solar forecast entry is
          missing and a synthetic seasonal curve is being used.
      - type: markdown
        title: Vehicles (what the twin understood)
        content: |
          {%- macro ent(sfx) -%}{%- set m = integration_entities('energy_twin') | select('match', 'sensor\\..*_' ~ sfx ~ '$') | list -%}{%- set c = 'sensor.home_energy_twin_' ~ sfx -%}{{ c if c in m else (m[0] if m else c) }}{%- endmacro -%}
          {% set vs = state_attr(ent('ev_charging_expected_tonight'), 'vehicles') %}
          {% if vs %}
          | Car | Mode | Found | Plugged | Home | Battery → limit | Needs | Planned | Why |
          |---|---|---|---|---|--:|--:|--:|---|
          {% for v in vs -%}
          | **{{ v.vehicle }}** | {{ v.mode }} | {{ v.entities.keys() | list | join(', ') if v.entities else '—' }} | {{ v.plugged }} ({{ v.raw_plug_state }}) | {{ v.home }} ({{ v.raw_home_state }}) | {{ v.soc_pct if v.soc_pct is not none else '—' }} → {{ v.target_soc_pct }}% | {{ v.needed_kwh if v.needed_kwh is not none else '?' }} kWh | {{ v.planned_kwh }} kWh | {{ v.why }} |
          {% endfor %}
          *Cars are planned from their state right now - plugged in at home, battery level and charge limit - and re-planned
          the moment that changes. A car left plugged in at its limit, or not plugged in, adds nothing to the plan.
          If a value shows `None`, the state wasn't recognised - set the override in the vehicle's options.*
          {% else %}No vehicles configured - add them under Configure → Vehicles.{% endif %}
      - type: entities
        entities:
          - {entity: button.home_energy_twin_reset_virtual_battery, name: Reset virtual battery & ledger}
